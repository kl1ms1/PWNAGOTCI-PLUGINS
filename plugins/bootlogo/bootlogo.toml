# bootlogo config. Copy what you need into /etc/pwnagotchi/config.toml.

main.custom_plugins = "/usr/local/share/pwnagotchi/custom-plugins/"
main.plugins.bootlogo.enabled = true

# Where the final boot logo is saved (1-bit PNG at the screen size).
main.plugins.bootlogo.path = "/root/pwnagotchi-bootlogo.png"

# Screen size is auto-detected. If it isn't — set it manually
# (e.g. Waveshare 2.13" = 250x122, 2.7" = 264x176, 2.9" = 296x128):
# main.plugins.bootlogo.width = 250
# main.plugins.bootlogo.height = 122
