# Example plugin config.
# Copy the lines you need into /etc/pwnagotchi/config.toml and replace "example"
# with your plugin's name (= the .py filename without the extension).

# path to custom plugins (once per config.toml)
main.custom_plugins = "/usr/local/share/pwnagotchi/custom-plugins/"

# enable the plugin
main.plugins.example.enabled = true

# any options of your own — they arrive in self.options["..."]
main.plugins.example.some_option = "value"
main.plugins.example.some_number = 42
