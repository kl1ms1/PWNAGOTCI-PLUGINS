# btlink config. Copy into /etc/pwnagotchi/config.toml.
#
# Pair the phone to pwnagotchi over Bluetooth like a speaker: on pairing,
# pwnagotchi shows a PASSKEY full-screen, iOS asks you to type it. Then it joins
# the phone's Bluetooth Personal Hotspot and shows its IP for the app.
#
# For the on-screen code you need: sudo apt install -y python3-gi python3-dbus
# (without them pairing still works, just code-free "just works").

main.plugins.btlink.enabled = true

# Bluetooth name shown when pairing:
# main.plugins.btlink.alias = "pwnagotchi"

# Auto-join the phone's BT-PAN after pairing (MAC auto-detected):
# main.plugins.btlink.auto_pan = true
# main.plugins.btlink.phone_mac = "AA:BB:CC:DD:EE:FF"
# main.plugins.btlink.pan_iface = "bnep0"
