# btlink config. Copy into /etc/pwnagotchi/config.toml.
#
# pwnagotchi raises ITS OWN secured Wi-Fi hotspot for the Companion app. The phone
# joins it by typing the password shown FULL-SCREEN on the e-ink. The app then
# connects to the device at the hotspot IP (default 192.168.50.1:8080).
#
# iPhone can't join a Pi's Bluetooth network, so "phone -> Pi + password" is Wi-Fi.
# ONE radio: while the hotspot is up, hunting is PAUSED. Enable to use the app,
# disable to hunt.
#
# Needs hostapd + dnsmasq on the device.

main.plugins.btlink.enabled = true

# Wi-Fi name the phone sees:
# main.plugins.btlink.ap_ssid = "pwn-Ki213"

# Password: leave "" to generate a stable one (shown on screen, saved so it stays
# the same across reboots), or set your own (min 8 chars):
# main.plugins.btlink.ap_pass = ""

# Hotspot IP — put <ip>:8080 in the app:
# main.plugins.btlink.ap_ip = "192.168.50.1"

# Wi-Fi channel:
# main.plugins.btlink.channel = 6
