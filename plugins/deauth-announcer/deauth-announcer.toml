# Конфиг deauth-announcer. Скопируй нужное в /etc/pwnagotchi/config.toml.

main.custom_plugins = "/usr/local/share/pwnagotchi/custom-plugins/"
main.plugins.deauth-announcer.enabled = true

# Показывать строку «кого глушу» на e-ink:
main.plugins.deauth-announcer.show_ui = true

# Позиция строки на экране (x,y) — подбери под свой дисплей:
main.plugins.deauth-announcer.position = "0,95"
