# vslider config. Copy into /etc/pwnagotchi/config.toml.

main.custom_plugins = "/usr/local/share/pwnagotchi/custom-plugins/"
main.plugins.vslider.enabled = true

# Open http://<ip>:8080/plugins/vslider/ and flip positions:
#   1 Auto      — normal hunting
#   2 Dashboard — pauses hunting, tabbed dashboard (Охота/Система/Комикс/Пароли/№5),
#                 tabs auto-rotate
#   3 ???       — reserved

# Connection line shown on the Охота tab (and the future Wi-Fi-join QR):
# main.plugins.vslider.ap_ssid = "pwn-Ki213"
# main.plugins.vslider.ap_pass = "changeme"
# main.plugins.vslider.web = "http://10.0.0.2:8080"

# Where pwndex stores its catalog (for the passwords tab):
# main.plugins.vslider.pwndex = "/root/.pwndex/dex.json"

# e-ink screen: full-screen dashboard in Dashboard mode (Hunt/Sys/Comic/Keys/#5).
# main.plugins.vslider.eink = true

# --- Field upload (the device uploads itself, no PC/phone/BT) ---
# On Dashboard (pos 2) there's an "⬆️ Залить на wpa-sec" button. It launches
# tools/pwn-sync.sh (copy it to the device) which fully stops pwnagotchi, borrows
# the single radio, connects to one of your saved pwndex profiles, uploads all
# handshakes to wpa-sec, downloads the cracked list, then restarts hunting. When
# pwnagotchi comes back, vslider replays the growing-number animation on the real
# counts and shows "Ура! загрузились!". Needs: a wpa-sec api_key, a saved pwndex
# profile in range, and systemd-run (ships with systemd). Copy the script once:
#   scp tools/pwn-sync.sh pi@10.0.0.2:/home/pi/pwn-sync.sh
# main.plugins.vslider.sync_script = "/home/pi/pwn-sync.sh"
#
# Hands-free: with sync_auto = true you don't have to press the button — being
# on Dashboard (pos 2) auto-runs the upload ONCE whenever a saved profile is in
# range, then waits sync_cooldown seconds before it may run again. Default off.
# main.plugins.vslider.sync_auto = true
# main.plugins.vslider.sync_cooldown = 900     # seconds between auto-syncs

# --- Wi-Fi access point flow on Dashboard (pos 2) — EXPERIMENTAL ---
# ap_mode: run the pos-2 flow (search profiles -> upload to wpa-sec -> own AP).
# ap_live: false = DRY-RUN (shows the on-screen flow + finds your profiled
#          networks, but touches NO networking — safe to try). true = go LIVE
#          (needs hostapd installed + a wpa-sec api_key; test with a reboot handy).
# main.plugins.vslider.ap_mode = true
# main.plugins.vslider.ap_live = false
# main.plugins.vslider.ap_ip   = "192.168.50.1"
# main.plugins.vslider.ap_iface = "wlan0"
# main.plugins.vslider.profiles = "/root/.pwndex/profiles.json"
