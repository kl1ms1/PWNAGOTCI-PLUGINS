# callout config. Copy what you need into /etc/pwnagotchi/config.toml.

main.custom_plugins = "/usr/local/share/pwnagotchi/custom-plugins/"
main.plugins.callout.enabled = true

# Your own phrases (optional). {name} = device name:
# main.plugins.callout.phrases = ["Kicking {name} off.", "Jamming {name}.", "No WiFi for {name}."]

# How many seconds to hold the phrase on screen when you hit "Test" (default 6).
# main.plugins.callout.test_seconds = 6
