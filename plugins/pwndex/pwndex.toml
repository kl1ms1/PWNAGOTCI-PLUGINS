# pwndex config. Copy what you need into /etc/pwnagotchi/config.toml.

main.custom_plugins = "/usr/local/share/pwnagotchi/custom-plugins/"
main.plugins.pwndex.enabled = true

# Catalog ALL visible networks (seen), not just captured ones (caught).
# false = only networks with a captured handshake end up in the dex.
main.plugins.pwndex.catalog_seen = true

# wpa-sec handshakes/potfile folder (usually auto-detected):
# main.plugins.pwndex.handshakes = "/home/pi/handshakes"

# Auto-add networks WITH A PASSWORD to the whitelist (so pwnagotchi won't attack them):
main.plugins.pwndex.auto_whitelist = true
