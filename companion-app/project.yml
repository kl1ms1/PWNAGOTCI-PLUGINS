name: PwnCompanion
options:
  bundleIdPrefix: com.pwncompanion
  deploymentTarget:
    iOS: "16.1"
  createIntermediateGroups: true
packages:
  Citadel:
    url: https://github.com/orlandos-nl/Citadel
    from: "0.7.0"
targets:
  PwnCompanion:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - package: Citadel
    settings:
      base:
        PRODUCT_NAME: PwnCompanion
        PRODUCT_BUNDLE_IDENTIFIER: com.pwncompanion.app
        MARKETING_VERSION: "9.4"
        CURRENT_PROJECT_VERSION: "94"
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
